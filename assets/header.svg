<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Peenaka Wedamulla - Quality, proven. Then shipped.">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#17171A" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="85%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#F5A524" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#F5A524" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#F5A524" stop-opacity="0"/>
      <stop offset="1" stop-color="#F5A524"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="380" rx="22" fill="#0B0B0C"/>
  <rect width="1200" height="380" rx="22" fill="url(#grid)"/>
  <rect width="1200" height="380" rx="22" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="22" fill="none" stroke="#2A2A2E"/>

  <!-- status line -->
  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15">
    <circle cx="60" cy="52" r="5" fill="#F5A524">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="76" y="57" fill="#8C887D">~/peenaka  <tspan fill="#F5A524">main</tspan>  ·  build passing</text>
    <text x="1140" y="57" fill="#8C887D" text-anchor="end">Colombo, LK · 6.9271° N</text>
  </g>

  <!-- name + tagline -->
  <text x="60" y="162" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="68" font-weight="700" letter-spacing="-2" fill="#F4F1EA">Peenaka Wedamulla</text>
  <text x="60" y="214" font-family="Georgia,'Times New Roman',serif" font-size="32" font-style="italic" fill="#C9C5BA">Quality, proven. <tspan fill="#F5A524">Then shipped.</tspan></text>
  <text x="60" y="250" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="16" fill="#8C887D" letter-spacing="1">SDET  ·  QA AUTOMATION  ·  DEVOPS  ·  FINTECH</text>

  <!-- pipeline -->
  <g>
    <line x1="100" y1="318" x2="1100" y2="318" stroke="#2A2A2E" stroke-width="2" stroke-dasharray="4 6"/>
    <line x1="100" y1="318" x2="100" y2="318" stroke="url(#bar)" stroke-width="3" stroke-linecap="round">
      <animate attributeName="x2" values="100;1100;1100" keyTimes="0;0.9;1" dur="7s" repeatCount="indefinite"/>
    </line>

    <!-- nodes at 100, 350, 600, 850, 1100 -->
    <g stroke="#0B0B0C" stroke-width="4">
      <circle cx="100" cy="318" r="10" fill="#2A2A2E"><animate attributeName="fill" values="#2A2A2E;#F5A524;#F5A524;#2A2A2E" keyTimes="0;0.01;0.95;1" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="350" cy="318" r="10" fill="#2A2A2E"><animate attributeName="fill" values="#2A2A2E;#2A2A2E;#F5A524;#F5A524;#2A2A2E" keyTimes="0;0.225;0.24;0.95;1" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="600" cy="318" r="10" fill="#2A2A2E"><animate attributeName="fill" values="#2A2A2E;#2A2A2E;#F5A524;#F5A524;#2A2A2E" keyTimes="0;0.45;0.465;0.95;1" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="850" cy="318" r="10" fill="#2A2A2E"><animate attributeName="fill" values="#2A2A2E;#2A2A2E;#F5A524;#F5A524;#2A2A2E" keyTimes="0;0.675;0.69;0.95;1" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="1100" cy="318" r="10" fill="#2A2A2E"><animate attributeName="fill" values="#2A2A2E;#2A2A2E;#F5A524;#F5A524;#2A2A2E" keyTimes="0;0.9;0.915;0.95;1" dur="7s" repeatCount="indefinite"/></circle>
    </g>

    <!-- travelling pulse -->
    <circle r="5" cy="318" fill="#FFD27A">
      <animate attributeName="cx" values="100;1100;1100" keyTimes="0;0.9;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.9;0.92;1" dur="7s" repeatCount="indefinite"/>
    </circle>

    <g font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="14" fill="#8C887D" text-anchor="middle">
      <text x="100" y="352">lint</text>
      <text x="350" y="352">build</text>
      <text x="600" y="352">test</text>
      <text x="850" y="352">deploy</text>
      <text x="1100" y="352" fill="#F5A524">shipped ✓</text>
    </g>
  </g>
</svg>
